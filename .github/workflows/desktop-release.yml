name: Desktop installers
on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
          - os: windows-latest
            args: --bundles nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: npm ci --prefix desktop
      - run: npm test --prefix desktop
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: desktop-v__VERSION__
          releaseName: Lessavio Desktop v__VERSION__
          releaseBody: 'Download the .dmg installer for macOS or setup.exe for Windows. Preview installers are unsigned.'
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}

      - name: Add download button assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess

          config = json.loads(Path("desktop/src-tauri/tauri.conf.json").read_text())
          version = config["version"]
          product = config["productName"]
          windows = os.environ["RUNNER_OS"] == "Windows"
          pattern = "*-setup.exe" if windows else "*.dmg"
          candidates = list(Path("desktop/src-tauri/target").rglob(pattern))
          if len(candidates) != 1:
              raise RuntimeError(f"Expected one installer for {pattern}, found {candidates}")
          name = f"{product}-Windows-Setup.exe" if windows else f"{product}-macOS.dmg"
          asset = Path(os.environ["RUNNER_TEMP"]) / name
          shutil.copy2(candidates[0], asset)
          subprocess.run(["gh", "release", "upload", f"desktop-v{version}", str(asset), "--clobber"], check=True)
          PYTHON
